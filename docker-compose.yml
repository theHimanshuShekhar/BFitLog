services:
  postgres:
    container_name: bfitlog_postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bfitlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bfitlog}
      POSTGRES_DB: ${POSTGRES_DB:-bfitlog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bfitlog} -d ${POSTGRES_DB:-bfitlog}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: bfitlog_app
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-bfitlog}:${POSTGRES_PASSWORD:-bfitlog}@postgres:5432/${POSTGRES_DB:-bfitlog}
      PORT: ${PORT:-3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      BETTER_AUTH_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:${PORT:-3000}}
      BETTER_AUTH_SECURE_COOKIES: ${BETTER_AUTH_SECURE_COOKIES:-false}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:${PORT:-3000},http://localhost:8081,http://localhost:19006,bfitlog://}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${PORT:-3000},http://localhost:8081,http://localhost:19006}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:'' + (process.env.PORT || ''3000'') + ''/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
